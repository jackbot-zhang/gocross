# =============================================================================
# 编译环境镜像里需要安装的 Go 版本清单（唯一数据源）
#
#   GO_VERSIONS     镜像要装的版本，第一个是镜像默认版本（项目没写 GO_VERSION 时用它）
#   BASE_IMAGE      基础发行版，改它会换掉整个编译环境
#   GO_DIST_MIRRORS Go 安装包下载源（按顺序尝试，第一个失败换下一个）
#
# 改完执行： ./goenv.sh apply      （镜像名带版本，变了才会重建）
# 查看现状： ./goenv.sh status
# 加版本：   ./goenv.sh add <版本>   （等价于改 GO_VERSIONS 再 apply）
#
# 注意：
#   - 加版本时保留原有版本，别的项目可能还在用
#   - 版本号要写完整（x.y.z）；项目 Makefile 的 GO_VERSION 必须与这里完全一致
#   - 删掉某个版本，还在用它编译的项目会直接报错；apply 时会提示哪些版本将被移除
# =============================================================================
GO_VERSIONS="1.26.11 1.27.4"
BASE_IMAGE="ubuntu:18.04"
GO_DIST_MIRRORS="https://golang.google.cn/dl https://go.dev/dl https://mirrors.aliyun.com/golang"
